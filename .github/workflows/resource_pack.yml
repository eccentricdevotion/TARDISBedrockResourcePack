# This is a basic workflow to help you get started with Actions

name: Resource Pack CI with Zip

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7.0.0

      - name: Delete old addon file
        uses: mknejp/delete-release-assets@v1
        with:
          assets: 'TARDISBedrockResourcePack.mcpack' # Globs or specific names of assets to delete
          tag: 'natives' # The tag of the release to modify
          token: ${{ secrets.TBRP_WORKFLOW }} # Required for authentication

      # Create .mcpack file
      - name: Zip resource pack
        uses: TheDoctor0/zip-release@0.7.6
        with:
          filename: 'release/TARDISBedrockResourcePack.mcpack'
          exclusions: 'README.md *.git* .gitignore .gitattributes /.github /release'

      - name: Add .mcpack to release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.TBRP_WORKFLOW }}
          tag_name: 'v1'
          files: 'TARDISBedrockResourcePack.mcpack'
          fail_on_unmatched_files: false
